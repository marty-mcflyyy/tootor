    <title>Tootor</title>
    <meta
      name="description"

    <div id="information">
      <h1>Tootor</h1>
      <p>
        Welcome to Tootor! This website can help you to learn trumpet
        fingerings.
      </p>
      <p>
        Use number keys 1, 2, and 3 or keys j, k, and l to press the valves on
        the trumpet. Enter using the "enter" key or space.
      </p>

    <div id="settings-box">
      <h2>Settings</h2>
      <fieldset id="key-picker">
        <legend>Key:</legend>
        <ul>
          <li>
            <input
              class="key-picker-option"
              type="radio"
              id="c-major"
              name="key"
              value="c-major"
              checked
            />
            <label for="c-major">C Major</label>
          </li>
          <li>
            <input
              class="key-picker-option"
              type="radio"
              id="g-major"
              name="key"
              value="g-major"
            />
            <label for="g-major">G Major</label>
          </li>
          <li>

              class="key-picker-option"
